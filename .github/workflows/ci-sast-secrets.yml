name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"
      - ".github/workflows/ci-sast-secrets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure evidence dir
        run: mkdir -p EVIDENCE/P10

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            returntocorp/semgrep:latest \
            semgrep ci \
              --config "p/ci" \
              --config "security/semgrep/rules.yml" \
              --sarif -o EVIDENCE/P10/semgrep.sarif \
            || true

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect \
              --source=/repo \
              --config=/repo/security/.gitleaks.toml \
              --report-format=json \
              --report-path=EVIDENCE/P10/gitleaks.json \
            || true

      - name: Generate SAST & Secrets summary
        run: |
          python - << 'PY'
          import json
          import collections
          import os
          from pathlib import Path

          evidence_dir = Path("EVIDENCE/P10")
          summary = []

          semgrep_path = evidence_dir / "semgrep.sarif"
          if semgrep_path.exists():
              data = json.loads(semgrep_path.read_text(encoding="utf-8"))
              runs = data.get("runs", [])
              results = runs[0].get("results", []) if runs else []
              sev_counts = collections.Counter()
              for r in results:
                  level = r.get("level", "warning")
                  sev_counts[level] += 1

              summary.append("## Semgrep")
              summary.append(f"Всего findings: {len(results)}")
              if sev_counts:
                  summary.append("Распределение по уровням:")
                  for level, count in sev_counts.items():
                      summary.append(f"- {level}: {count}")
              else:
                  summary.append("Findings нет.")

          gitleaks_path = evidence_dir / "gitleaks.json"
          if gitleaks_path.exists():
              try:
                  gdata = json.loads(gitleaks_path.read_text(encoding="utf-8"))
                  if isinstance(gdata, list):
                      leaks = gdata
                  else:
                      leaks = gdata.get("findings", [])
                  summary.append("")
                  summary.append("## Gitleaks")
                  summary.append(f"Всего потенциальных секретов: {len(leaks)}")
              except Exception:
                  pass

          if not summary:
              summary.insert(0, "# SAST & Secrets summary")
              summary.append("")
              summary.append("Отчёты не найдены.")
          else:
              summary.insert(0, "# SAST & Secrets summary")

          sha = os.environ.get("GITHUB_SHA", "")
          run_url = os.environ.get("GITHUB_RUN_URL", "")
          summary.append("")
          summary.append("---")
          if sha:
              summary.append(f"Commit: `{sha}`")
          if run_url:
              summary.append(f"Workflow run: {run_url}")

          out = evidence_dir / "sast_summary.md"
          out.write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P10_EVIDENCE
          path: EVIDENCE/P10
